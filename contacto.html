<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sebas — Contacto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
   <script src="js/main.js"></script>
</head>
<body>

  <header class="site">
    <nav class="main">
      <span class="brand">SEBAS<span>.DEV</span></span>
      <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false">MENÚ</button>
      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="sobreMi.html">Sobre mí</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="panel">
      <p class="eyebrow">// contacto</p>
      <h1>Hablemos</h1>
      <p>¿Tienes una idea que pueda resolver? Escríbeme.</p>

      <form id="form-contacto">
        <div class="field">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" required>
        </div>
        <div class="field">
          <label for="email">Correo</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="field">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn">Enviar mensaje</button>
        <p id="toast" role="status"></p>
      </form>
      
    </section>
  </main>

  <footer class="site">
    <p>&copy; 2026 Sebastián — hecho con HTML, CSS y JavaScript.</p>
  </footer>
</body>
</html>
