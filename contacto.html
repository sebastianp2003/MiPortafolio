<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sebas — Contacto</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site">
    <nav class="navbar navbar-expand-sm navbar-custom">
      <div class="container-fluid p-0">
        <span class="navbar-brand brand m-0">SEBAS<span>.DEV</span></span>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal" aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
          MENÚ
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
          <ul class="navbar-nav ms-auto gap-1">
            <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
            <li class="nav-item"><a class="nav-link" href="sobreMi.html">Sobre mí</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="panel fade-target">
      <p class="eyebrow">// contacto</p>
      <h1>Hablemos</h1>
      <p>¿Tienes una idea que pueda resolver? Escríbeme.</p>

      <form id="form-contacto" novalidate>
        <div class="field">
          <label for="nombre">Nombre</label>
          <input type="text" class="form-control form-control-terminal" id="nombre" name="nombre" required>
          <div class="invalid-feedback-terminal"></div>
        </div>
        <div class="field">
          <label for="email">Correo</label>
          <input type="email" class="form-control form-control-terminal" id="email" name="email" required>
          <div class="invalid-feedback-terminal"></div>
        </div>
        <div class="field">
          <label for="mensaje">Mensaje</label>
          <textarea class="form-control form-control-terminal" id="mensaje" name="mensaje" rows="5" required></textarea>
          <div class="invalid-feedback-terminal"></div>
        </div>
        <button type="submit" class="btn btn-terminal">Enviar mensaje</button>
        <p id="toast" role="status"></p>
      </form>

      <div class="social-row">
        <a href="#" target="_blank" rel="noopener">GitHub</a>
        <a href="#" target="_blank" rel="noopener">LinkedIn</a>
      </div>
    </section>
  </main>

  <footer class="site">
    <p>&copy; 2026 Sebastián — hecho con HTML, CSS, JavaScript, Bootstrap y jQuery.</p>
  </footer>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
